<nav
  class="mobile-nav fixed inset-x-0 bottom-0 z-50 md:hidden"
  aria-label="Điều hướng nhanh"
>
  <ul class="mobile-nav__bar mx-auto flex max-w-lg items-stretch justify-around px-2">
    @for (item of items; track item.label) {
      <li class="flex min-w-0 flex-1">
        <a
          [href]="item.href"
          [attr.target]="item.external ? '_blank' : null"
          [attr.rel]="item.external ? 'noopener noreferrer' : null"
          class="mobile-nav__item"
          [class.mobile-nav__item--primary]="item.primary"
        >
          @switch (item.icon) {
            @case ('platforms') {
              <svg class="mobile-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M4 6.5A2.5 2.5 0 0 1 6.5 4h3A2.5 2.5 0 0 1 12 6.5v3A2.5 2.5 0 0 1 9.5 12h-3A2.5 2.5 0 0 1 4 9.5v-3ZM12.5 6.5A2.5 2.5 0 0 1 15 4h3a2.5 2.5 0 0 1 2.5 2.5v3A2.5 2.5 0 0 1 18 12h-3a2.5 2.5 0 0 1-2.5-2.5v-3ZM4 15a2.5 2.5 0 0 1 2.5-2.5h3A2.5 2.5 0 0 1 12 15v3a2.5 2.5 0 0 1-2.5 2.5h-3A2.5 2.5 0 0 1 4 18v-3ZM14 16.25h6M17 13.25v6"
                />
              </svg>
            }
            @case ('download') {
              <svg class="mobile-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 3.5v11m0 0 4-4m-4 4-4-4M5 17.5v1A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5v-1"
                />
              </svg>
            }
            @case ('install') {
              <svg class="mobile-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M7 4.5h7.5L19 9v10.5A2 2 0 0 1 17 21.5H7a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2Z"
                />
                <path
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M14.5 4.5V9H19M9 13h6M9 17h4"
                />
              </svg>
            }
            @case ('github') {
              <svg class="mobile-nav__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path
                  d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75 0 4.308 2.793 7.965 6.663 9.255.487.09.665-.211.665-.47 0-.232-.009-.847-.013-1.663-2.71.588-3.282-1.306-3.282-1.306-.443-1.125-1.082-1.425-1.082-1.425-.885-.605.067-.593.067-.593.978.069 1.493 1.005 1.493 1.005.87 1.49 2.282 1.06 2.838.81.088-.63.34-1.06.618-1.304-2.164-.246-4.438-1.082-4.438-4.815 0-1.064.38-1.934 1.003-2.616-.1-.246-.435-1.238.096-2.58 0 0 .818-.262 2.68 1 .778-.216 1.613-.324 2.443-.328.83.004 1.665.112 2.445.328 1.86-1.262 2.676-1 2.676-1 .533 1.342.198 2.334.098 2.58.625.682 1.002 1.552 1.002 2.616 0 3.742-2.278 4.566-4.45 4.808.35.302.662.897.662 1.808 0 1.305-.012 2.357-.012 2.678 0 .261.176.564.67.468A9.754 9.754 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75Z"
                />
              </svg>
            }
          }
          <span class="mobile-nav__label">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
