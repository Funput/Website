# TLS terminates at the deployment's reverse proxy.
server {
    listen 80;
    server_name www.funput.app;
    return 308 https://funput.app$request_uri;
}

server {
    listen 80 default_server;
    server_name funput.app localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Preserve the sitemap address used by the previous website.
    location = /sitemap.xml {
        return 301 /sitemap-index.xml;
    }

    # Missing pages must be real 404s, not a successful copy of the homepage.
    error_page 404 /404.html;
    location = /404.html {
        add_header X-Robots-Tag "noindex, follow" always;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    # Crawling instructions and sitemaps should refresh promptly after deployment.
    location ~* \.(xml|txt)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
}
